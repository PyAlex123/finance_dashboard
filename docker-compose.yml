# Прод-деплой на подпуть (напр. grammerce.io/dashboards): ОДИН контейнер —
# FastAPI отдаёт фронт + API, данные в SQLite (том app_data). Порт слушает только
# на 127.0.0.1 — наружу проксирует существующий nginx (см. DEPLOY.md).
#
# Запуск: docker compose --env-file .env.docker up -d --build
#
# ВАЖНО: имя проекта, образа и контейнера ЖЁСТКО зафиксированы и уникальны, чтобы
# исключить любое пересечение с другими compose-проектами на том же сервере
# (совпадение имени проекта+сервиса даёт общий тег образа и ломает чужой стек).
# НЕ передавайте флаг -p — он перебивает имя ниже.
name: finance-dashboard

services:
  app:
    image: finance-dashboard-app:latest      # уникальный тег образа (не «*-app»)
    container_name: finance-dashboard-app     # уникальное имя контейнера
    build:
      context: .
      args:
        VITE_BASE: ${VITE_BASE:-/dashboards/}
        VITE_API_URL: ${VITE_API_URL:-/dashboards}
    environment:
      BASE_PATH: ${BASE_PATH:-/dashboards}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/fin_reports.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    restart: unless-stopped

volumes:
  app_data:
