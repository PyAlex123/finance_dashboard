name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Фронтенд — типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  server:
    name: Бэкенд — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r server/requirements.txt

      # Тесты написаны самостоятельными скриптами (pytest не требуется):
      # каждый файл сам печатает результат и падает с ненулевым кодом при ошибке.
      - name: Прогон тестов
        working-directory: server
        env:
          PYTHONPATH: .
        run: |
          for f in tests/test_*.py; do
            echo "=== $f ==="
            python "$f"
          done

  secrets:
    name: Поиск секретов в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
