# SPA-раздача + обратный прокси API. Фронт и бэкенд на одном origin —
# браузеру (и Telegram WebView) не нужен CORS, запросы идут относительными /api.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → сервис api из docker-compose
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: любые пути отдают index.html (клиентский роутинг)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # долгий кэш для хэшированных ассетов
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
