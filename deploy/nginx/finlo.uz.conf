# Сайт finlo.uz → тот же контейнер finance-dashboard (127.0.0.1:8090), но уже
# в КОРНЕ домена: https://finlo.uz/ — лендинг, /login, /privacy, /terms, /app.
#
# Сервер тот же, IP тот же (46.8.194.38): nginx различает сайты по server_name,
# поэтому grammerce.io и finlo.uz мирно живут рядом. Конфиг основного сайта
# (grammerce.io.conf) не трогаем — там только добавлен редирект /dashboards.
#
# Применение (см. DEPLOY.md, раздел «Переезд на finlo.uz»):
#   scp этот файл → /etc/nginx/sites-available/finlo.uz
#   ln -s /etc/nginx/sites-available/finlo.uz /etc/nginx/sites-enabled/finlo.uz
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d finlo.uz -d www.finlo.uz     # сам допишет TLS-секцию сюда
#
# ВАЖНО: блок ниже только на :80. Сертификата ещё нет, и если прописать ssl-пути
# заранее, `nginx -t` упадёт. TLS и редирект на https добавит сам certbot.

server {
    listen 80;
    server_name finlo.uz www.finlo.uz;
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
