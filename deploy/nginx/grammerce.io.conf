# Готовый конфиг сайта grammerce.io с добавленным маршрутом /dashboards на наш
# контейнер (127.0.0.1:8090). Это ТОЧНАЯ копия текущего конфига + два location.
# Существующий location / (→ 127.0.0.1:8005) не изменён.
#
# Применение (см. DEPLOY.md, раздел nginx): скопировать поверх
# /etc/nginx/sites-available/grammerce.io, затем `nginx -t` и `reload`.
server {
    listen 80;
    server_name grammerce.io www.grammerce.io;
    client_max_body_size 500M;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grammerce.io www.grammerce.io;
    client_max_body_size 500M;

    ssl_certificate /etc/letsencrypt/live/grammerce.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grammerce.io/privkey.pem;

    # --- старый адрес /dashboards → новый сайт finlo.uz ---
    # После переезда приложение отдаётся в корне finlo.uz (см. finlo.uz.conf).
    # Здесь остаётся только редирект, чтобы старые ссылки и закладки не умерли.
    location = /dashboards { return 301 https://finlo.uz/; }
    location /dashboards/ {
        rewrite ^/dashboards/(.*)$ https://finlo.uz/$1 permanent;
    }

    # --- существующий основной сайт (не менять) ---
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
