# Редирект со старого размещения на подпути (`<домен>/dashboards`) на текущий сайт
# в корне finlo.uz. Нужен, если приложение раньше жило подпутём чужого домена:
# у пользователей остаются старые ссылки и кнопки Web App в истории чата Telegram.
#
# Фрагмент адреса (`#tgWebAppData=…`, по которому Telegram передаёт initData) при
# редиректе сохраняет сам браузер, поэтому автовход в Web App продолжает работать.
#
# Применение: добавить эти два location в конфиг прежнего домена ВМЕСТО прежнего
# проксирования на контейнер, затем `nginx -t` и `systemctl reload nginx`.

location = /dashboards { return 301 https://finlo.uz/; }

location /dashboards/ {
    rewrite ^/dashboards/(.*)$ https://finlo.uz/$1 permanent;
}
