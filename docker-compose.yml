# Прод-деплой на подпуть (напр. grammerce.io/dashboards): ОДИН контейнер —
# FastAPI отдаёт фронт + API, данные в SQLite (том app_data). Порт слушает только
# на 127.0.0.1 — наружу проксирует существующий nginx (см. DEPLOY.md).
#
# Запуск: docker compose --env-file .env.docker up -d --build
#
# ВАЖНО: имя проекта, образа и контейнера ЖЁСТКО зафиксированы и уникальны, чтобы
# исключить любое пересечение с другими compose-проектами на том же сервере
# (совпадение имени проекта+сервиса даёт общий тег образа и ломает чужой стек).
# НЕ передавайте флаг -p — он перебивает имя ниже.
name: finance-dashboard

services:
  app:
    image: finance-dashboard-app:latest      # уникальный тег образа (не «*-app»)
    container_name: finance-dashboard-app     # уникальное имя контейнера
    build:
      context: .
      args:
        # Корень домена (finlo.uz). Для подпути — /dashboards/ и /dashboards.
        # VITE_API_URL пустым НЕ оставлять: пустое значение = локальный режим
        # (IndexedDB), сервер перестаёт использоваться. В корне это «/».
        VITE_BASE: ${VITE_BASE:-/}
        VITE_API_URL: ${VITE_API_URL:-/}
    environment:
      # Пустой BASE_PATH = приложение в корне домена. Здесь именно `:-`, поэтому
      # «BASE_PATH=» в .env.docker (пустая строка) тоже даёт корень.
      BASE_PATH: ${BASE_PATH:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/fin_reports.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    restart: unless-stopped

  # Процесс-бот: отвечает на /start кнопкой Web App и ставит меню «Кабинет».
  # Переиспользует ОБРАЗ сервиса app (своего build нет) — меняем только команду.
  # Наружу ничего не слушает; long-polling к api.telegram.org. Изоляция та же
  # (общий name: finance-dashboard, уникальный container_name).
  bot:
    image: finance-dashboard-app:latest
    container_name: finance-dashboard-bot
    command: ["python", "-m", "app.bot"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEBAPP_URL: ${WEBAPP_URL:-https://finlo.uz/}
      # Подтверждение входа с сайта: бот стучится в API сервиса `app` по внутренней
      # сети compose и подписывает запрос общим JWT_SECRET. BASE_PATH должен
      # совпадать с сервисом app — из него собирается адрес внутреннего API.
      BASE_PATH: ${BASE_PATH:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
